[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tessscope"
version = "0.1.0"
description = "Task-aware phase-only pupil optimization through JAX/Chromatix and PyTorch/InstanSeg Tesseracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "rajpatilrobotics" }]
dependencies = [
  "chromatix @ git+https://github.com/chromatix-team/chromatix.git@ce1482906fc663298613bb252bbf425e3be59839",
  "instanseg-torch==0.1.1",
  "jax>=0.7.0",
  "matplotlib>=3.10",
  "numpy>=1.26,<2.6",
  "pandas>=2.2",
  "pillow>=11",
  "pyyaml>=6",
  "scikit-image>=0.25",
  "seaborn>=0.13",
  "scipy>=1.14",
  "tesseract-core[runtime]==1.12.0",
  "tesseract-jax==0.4.1",
  "tesseract-torch==0.1.0",
  "torch>=2.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tessscope"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
