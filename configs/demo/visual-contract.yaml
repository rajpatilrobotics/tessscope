phase: tessscope_evidence_first_demo_v1
status: preregistered_before_example_selection_or_rendering
source_commit: ccec9b2

data_boundary:
  allowed_splits: [training, validation]
  qualitative_split: validation
  forbidden_split: test
  prohibit_test_path_tokens: [test, locked-test, bbbc006-test]
  prohibit_generated_microscopy: true

systems:
  exact: v2_3-exact-balanced-segmentation_only-step-14
  stopped: v2_4-stopped-balanced-segmentation_only-step-14
  piecewise: v2_2-piecewise-028
  clear: clear
  segmentation_reference: b7_segmentation_only

representative_selection:
  population: 27 frozen hard-density validation fields at six nonzero depths
  unit: field
  field_features:
    - exact_before_pq_mean
    - exact_after_pq_mean
    - exact_improvement_fraction
    - exact_residual_depth_mae_um
    - exact_minus_stopped_after_pq_mean
    - exact_minus_piecewise_after_pq_mean
  center: population_feature_median
  scale: 1.4826_times_population_feature_mad
  zero_scale_fallback: 1.0
  distance: mean_absolute_robust_z_across_field_features
  selection: minimum_distance
  tie_break: sha256_ascending
  tie_seed: tessscope-demo-representative-v1
  display_depth_rule: >-
    Within the selected field, select the nonzero depth whose six-metric frame vector
    has minimum mean absolute robust-z distance to the six-depth within-field medians;
    ties use the same seeded SHA-256 ordering.
  display_depth_features:
    - exact_before_pq
    - exact_after_pq
    - exact_after_minus_before_pq
    - exact_residual_depth_absolute_um
    - exact_minus_stopped_after_pq
    - exact_minus_piecewise_after_pq
  prohibition: rendered appearance cannot enter field or depth selection

crop_and_geometry:
  source_patch_px: [256, 256]
  validation_origin_source: tessscope.v2.optimization.served.collect_patches_validation_seed_53
  observer_metric_grid_px: [330, 330]
  display_sensor_grid_px: [256, 256]
  label_to_sensor_interpolation: nearest_neighbor_identical_for_all_systems
  valid_metric_margin_px: 62
  comparison_rule: identical_field_origin_depth_geometry_and_interpolation
  scale_bar: omitted
  scale_bar_reason: >-
    The stored simulation and observer outputs do not provide an authoritative physical
    sensor-plane pixel calibration for this display; no scale is inferred.

display_transform:
  name: frozen_observer_affine
  formula: clip((sensor - 0.0) / exposure_gain, 0.0, 1.0)
  exposure_gain_source: data/manifests/v2/bbbc006-training-calibration.json#/exposure/gain
  global_across_all_sensor_panels: true
  per_image_normalization: false
  forbidden:
    - per_image_contrast
    - local_histogram_equalization
    - sharpening
    - denoising
    - gamma_tuning
    - geometry_changes_between_systems

labels_and_boundaries:
  observer: frozen InstanSeg model used by v2.4 evaluation
  reference: frozen automated BBBC006 reference instances
  boundary_width_px: 1
  compare_on_same_valid_region: true
  reference_color: "#0072B2"
  prediction_color: "#D55E00"
  overlap_color: "#CC79A7"

quantitative_style:
  palette: okabe_ito
  exact: "#0072B2"
  stopped: "#D55E00"
  piecewise: "#009E73"
  clear: "#7A7A7A"
  uncertainty: paired_well_bootstrap_95_percent
  pq_label: Panoptic quality (PQ; 0–1)
  prohibit_percent_accuracy_wording: true

outputs:
  figures:
    - matched-microscopy
    - pupil-psf-depth
    - pq-focus-depth
    - causal-comparison
    - gradient-architecture
  animation: validation-depth-sweep
  raster: {format: png, dpi: 300, transparent: false}
  vector: [svg, pdf]
  animation_formats: [mp4, gif]
  accessibility: captions_and_alt_text_required
  determinism: source_and_output_sha256_required

demo:
  mode: local_static_cached_replay
  live_training: false
  live_inference: false
  download_full_dataset: false
  locked_test_access: false
  first_view: exact_closed_loop_causal_gain_with_piecewise_limitation
  minimum_width_px: 320
  reduced_motion_required: true
  one_command: "python scripts/serve_demo.py"
